name: Android and shared checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify source is present
        run: test -f ./gradlew && test -f ./settings.gradle.kts
      - name: Shared tests and Android debug build
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:allTests :androidApp:assembleDebug --stacktrace
